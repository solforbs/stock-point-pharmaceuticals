; Queue worker for background jobs (eTIMS submissions are queued after each
; sale commits). Restarted on every deploy by `php artisan queue:restart`.
[program:stockpoint-queue]
process_name=%(program_name)s_%(process_num)02d
command=php __APP_DIR__/artisan queue:work database --sleep=3 --tries=3 --backoff=30 --max-time=3600
directory=__APP_DIR__
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/queue-worker.log
