; Reverb websocket server (realtime alerts + user messages). Listens on
; 127.0.0.1:8080; nginx proxies wss:// traffic at /app to it.
[program:stockpoint-reverb]
process_name=%(program_name)s_%(process_num)02d
command=php __APP_DIR__/artisan reverb:start --host=127.0.0.1 --port=8080
directory=__APP_DIR__
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/reverb.log
